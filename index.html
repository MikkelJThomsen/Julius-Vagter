<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Julius Vagter"><title>Julius Vagter</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;background:#f5f5f7;color:#17171a}.app{max-width:600px;margin:auto;padding:48px 16px 100px}h1{font-size:32px;margin:0 0 22px}.card{background:white;border-radius:18px;padding:18px;margin:0 0 16px;box-shadow:0 1px 2px #0001}.muted{color:#777;display:block;font-size:14px}.hours{font-size:20px;font-weight:700;margin:8px 0}.money{font-size:38px;font-weight:800;margin:18px 0 4px}.btn{width:100%;border:0;border-radius:14px;padding:16px;margin:0 0 14px;background:#007aff;color:#fff;font-size:17px;font-weight:700}.secondary{background:#e7e7eb;color:#111}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}.tabs-inner{max-width:600px;margin:auto;display:flex}.tab{flex:1;text-align:center;padding:10px 4px;color:#777;font-size:12px}.tab span{display:block;font-size:22px}.tab.active{color:#007aff}.shift{padding:14px 0;border-bottom:1px solid #eee}.row{display:flex;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;margin-top:10px}.mini{border:0;border-radius:9px;padding:8px 12px}.edit{background:#e7f1ff}.delete{background:#ffe8e8;color:#b00020}.empty{padding:18px 0;color:#777}label{display:block;font-size:14px;color:#666;margin:14px 0 6px}input,select{width:100%;font:inherit;padding:13px;border:1px solid #d4d4d8;border-radius:12px;background:#fff}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.small-card{background:#fff;border-radius:16px;padding:15px}.small-card b{display:block;font-size:20px;margin-top:5px}
</style></head><body><div id="app"></div>
<script>
(()=>{'use strict';
const KEY='julius-vagter-v1',RATEKEY='julius-vagter-rate';let shifts=[],rate=80,tab='home',editId=null,selectedPeriod=null;
try{shifts=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(shifts))shifts=[];rate=Number(localStorage.getItem(RATEKEY)||80)||80}catch(e){}
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
function localISO(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function periodFor(d){d=new Date(d);let em=d.getDate()>=20?d.getMonth()+1:d.getMonth(),ey=d.getFullYear();if(em>11){em=0;ey++}let sm=em-1,sy=ey;if(sm<0){sm=11;sy--}return{start:new Date(sy,sm,20),end:new Date(ey,em,19),key:`${ey}-${pad(em+1)}`,name:new Intl.DateTimeFormat('da-DK',{month:'long',year:'numeric'}).format(new Date(ey,em,1))}}
function mins(t){const [h,m]=t.split(':').map(Number);return h*60+m}function work(x){let n=mins(x.end)-mins(x.start)-Number(x.break||0);if(n<0)n+=1440;return Math.max(0,n)}
function money(n){return new Intl.NumberFormat('da-DK',{style:'currency',currency:'DKK',minimumFractionDigits:2}).format(n)}function dur(m){return `${Math.floor(m/60)} t ${m%60} min`}function fmt(s){return new Intl.DateTimeFormat('da-DK',{day:'numeric',month:'short',year:'numeric'}).format(parseDate(s))}
function save(){localStorage.setItem(KEY,JSON.stringify(shifts));localStorage.setItem(RATEKEY,String(rate))}function inP(x,p){const d=parseDate(x.date);return d>=p.start&&d<=p.end}function sum(l){const m=l.reduce((a,x)=>a+work(x),0);return{m,pay:m/60*rate}}
function nav(content){return `<main class="app">${content}</main><nav class="tabs"><div class="tabs-inner"><button class="tab ${tab==='home'?'active':''}" data-nav="home"><span>⌂</span>Overblik</button><button class="tab ${tab==='shifts'?'active':''}" data-nav="shifts"><span>☷</span>Vagter</button><button class="tab ${tab==='settings'?'active':''}" data-nav="settings"><span>⚙︎</span>Indstillinger</button></div></nav>`}
function shiftHtml(x){const m=work(x);return `<div class="shift"><div class="row"><div><strong>${fmt(x.date)}</strong><span class="muted">${x.start}–${x.end} · ${x.break} min pause</span></div><div style="text-align:right"><strong>${money(m/60*rate)}</strong><span class="muted">${dur(m)}</span></div></div><div class="actions"><button class="mini edit" data-edit="${x.id}">Rediger</button><button class="mini delete" data-delete="${x.id}">Slet</button></div></div>`}
function home(){const p=periodFor(new Date()),l=shifts.filter(x=>inP(x,p)),s=sum(l);return nav(`<h1>Julius Vagter</h1><div class="card"><div class="muted">Denne lønperiode</div><div class="hours">${fmt(localISO(p.start))} – ${fmt(localISO(p.end))}</div><div class="money">${money(s.pay)}</div><div class="muted">${dur(s.m)} · ${l.length} ${l.length===1?'vagt':'vagter'}</div></div><button class="btn" id="addShift">＋ Registrer vagt</button><div class="card"><strong>Seneste vagter</strong>${shifts.length?shifts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(shiftHtml).join(''):'<div class="empty">Ingen vagter registreret endnu.</div>'}</div>`)}
function periods(){let ps=[...new Map(shifts.map(x=>{const p=periodFor(parseDate(x.date));return[p.key,p]})).values()].sort((a,b)=>b.key.localeCompare(a.key));const cur=periodFor(new Date());if(!ps.some(p=>p.key===cur.key))ps.unshift(cur);if(!selectedPeriod)selectedPeriod=cur.key;let p=ps.find(p=>p.key===selectedPeriod)||ps[0],l=shifts.filter(x=>inP(x,p)).sort((a,b)=>b.date.localeCompare(a.date)),s=sum(l);return nav(`<h1>Vagter</h1><select id="periodSelect">${ps.map(q=>`<option value="${q.key}" ${q.key===p.key?'selected':''}>${q.name[0].toUpperCase()+q.name.slice(1)} · ${fmt(localISO(q.start))} – ${fmt(localISO(q.end))}</option>`).join('')}</select><div class="summary-grid"><div class="small-card"><span class="muted">Arbejdstid</span><b>${dur(s.m)}</b></div><div class="small-card"><span class="muted">Forventet løn</span><b>${money(s.pay)}</b></div></div><div class="card">${l.length?l.map(shiftHtml).join(''):'<div class="empty">Ingen vagter i denne lønperiode.</div>'}</div><button class="btn" id="addShift">＋ Registrer vagt</button>`)}
function settings(){return nav(`<h1>Indstillinger</h1><div class="card"><label>Timeløn (kr.)</label><input id="rate" type="number" inputmode="decimal" step="0.5" value="${rate}"><button class="btn" id="saveRate">Gem timeløn</button><p class="muted">Lønperioder går automatisk fra den 20. til den 19.</p></div>`)}
function form(id){editId=id||null;const x=shifts.find(s=>s.id===id)||{date:localISO(new Date()),start:'16:00',end:'20:00',break:0};$('app').innerHTML=`<main class="app"><h1>${id?'Rediger vagt':'Registrer vagt'}</h1><div class="card"><label>Dato</label><input id="date" type="date" value="${x.date}"><label>Mødetid</label><input id="start" type="time" value="${x.start}"><label>Sluttid</label><input id="end" type="time" value="${x.end}"><label>Pause (minutter)</label><input id="break" type="number" inputmode="numeric" min="0" value="${x.break}"></div><button class="btn" id="saveShift">Gem vagt</button><button class="btn secondary" id="cancel">Annuller</button></main>`;bindForm()}
function submit(){const x={id:editId||String(Date.now()),date:$('date').value,start:$('start').value,end:$('end').value,break:Number($('break').value||0)};if(!x.date||!x.start||!x.end){alert('Udfyld dato, mødetid og sluttid.');return}const i=shifts.findIndex(s=>s.id===x.id);i>=0?shifts[i]=x:shifts.push(x);save();tab='home';render()}
function bindForm(){$('saveShift').addEventListener('click',submit);$('cancel').addEventListener('click',render)}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.nav;render()}));document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>form(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{if(confirm('Vil du slette denne vagt?')){shifts=shifts.filter(x=>x.id!==b.dataset.delete);save();render()}}));const a=$('addShift');if(a)a.addEventListener('click',()=>form());const p=$('periodSelect');if(p)p.addEventListener('change',()=>{selectedPeriod=p.value;render()});const r=$('saveRate');if(r)r.addEventListener('click',()=>{rate=Number($('rate').value)||80;save();render()})}
function render(){$('app').innerHTML=tab==='home'?home():tab==='shifts'?periods():settings();bind()}
render();
})();
</script></body></html>
